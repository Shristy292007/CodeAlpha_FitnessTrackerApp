<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Fitness Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>💪 FitTrack</h1>
            <p id="todayDate"></p>
        </header>

        <!-- Summary Dashboard -->
        <div class="dashboard">
            <div class="stat-card">
                <h3>👟 Steps</h3>
                <h2 id="totalSteps">0</h2>
                <div class="progress-bar"><div id="stepsBar" class="progress"></div></div>
                <small>Goal: 10,000</small>
            </div>
            <div class="stat-card">
                <h3>🔥 Calories</h3>
                <h2 id="totalCalories">0</h2>
                <div class="progress-bar"><div id="calBar" class="progress orange"></div></div>
                <small>Goal: 2,000 kcal</small>
            </div>
            <div class="stat-card">
                <h3>⏱ Workout</h3>
                <h2 id="totalWorkout">0 min</h2>
                <div class="progress-bar"><div id="workBar" class="progress green"></div></div>
                <small>Goal: 60 min</small>
            </div>
        </div>

        <!-- Graph -->
        <div class="chart-box">
            <h3>Weekly Progress</h3>
            <canvas id="fitnessChart"></canvas>
        </div>

        <!-- Add Activity Form -->
        <div class="form-box">
            <h3>Add Today's Activity</h3>
            <div class="form-grid">
                <input type="number" id="steps" placeholder="Steps (e.g. 5000)">
                <input type="number" id="calories" placeholder="Calories Burned">
                <input type="number" id="workout" placeholder="Workout Time (min)">
                <select id="type">
                    <option value="Walking">Walking</option>
                    <option value="Running">Running</option>
                    <option value="Gym">Gym</option>
                    <option value="Yoga">Yoga</option>
                    <option value="Cycling">Cycling</option>
                </select>
            </div>
            <button class="btn-primary" id="addBtn">+ Log Activity</button>
        </div>

        <!-- History -->
        <div class="history-box">
            <h3>Recent Logs</h3>
            <ul id="historyList"></ul>
            <button class="btn-clear" id="clearBtn">Clear All Data</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
